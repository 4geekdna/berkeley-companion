<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Berkeley Companion</title>
<style>
:root { --bg:#fafafa; --text:#222; --muted:#666; --accent:#c2410c; --border:#eee; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
header { background:#7c2d12; color:#fff; padding:8px 12px; position:sticky; top:0; z-index:10; }
header h1 { margin:0; font-size:1.1rem; }
.base { background:#fff7ed; padding:6px 12px; font-size:.8rem; border-bottom:1px solid var(--border); }
.base a { color:var(--accent); font-weight:600; text-decoration:none; margin-right:8px; }
.collapsible { background:#f8f9fa; border-bottom:1px solid var(--border); }
.collapsible-head { padding:8px 12px; font-weight:700; font-size:.85rem; cursor:pointer; display:flex; justify-content:space-between; align-items:center; background:#e9ecef; }
.collapsible-head::after { content:'\25BC'; font-size:.7rem; }
.collapsible.closed .collapsible-head::after { content:'\25B6'; }
.collapsible-body { display:block; padding:8px 12px; font-size:.8rem; line-height:1.5; }
.collapsible.closed .collapsible-body { display:none; }
.search { padding:6px 12px; background:#fff; border-bottom:1px solid var(--border); }
.search input { width:100%; padding:6px 10px; border:1px solid #ddd; border-radius:6px; font-size:.9rem; }
.section { margin:0; }
.sec-title { background:#f3f4f6; padding:5px 12px; font-size:.75rem; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:#444; border-top:1px solid var(--border); border-bottom:1px solid var(--border); position:sticky; top:36px; cursor:pointer; }
.row { padding:6px 12px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f5f5f5; background:#fff; }
.row .l { flex:1; }
.row .l b { font-size:.9rem; }
.row .l span { display:block; font-size:.7rem; color:var(--muted); }
.row .r a, .collapsible-body a.w, .collapsible-body a.s, .collapsible-body a.c, .collapsible-body a.u { display:inline-block; margin:2px 4px 2px 0; padding:3px 7px; border-radius:4px; font-size:.65rem; font-weight:700; text-decoration:none; color:#fff; }
.w { background:#c2410c; } .s { background:#555; } .c { background:#15803d; } .u { background:#000; }
footer { text-align:center; font-size:.65rem; color:var(--muted); padding:10px; }
.detail.show { display:block !important; }
</style>
</head>
<body>
<header><h1>Berkeley Companion</h1></header>
<div class="base">Shattuck Plaza · 2086 Allston Way · <a href="https://www.hotelshattuckplaza.com/" target="_blank">Hotel</a> <a href="https://www.google.com/maps/search/?api=1&query=Hotel+Shattuck+Plaza+2086+Allston+Way+Berkeley" target="_blank">Map</a> <a href="tel:+15108457300">Call</a></div>
<p style="padding:12px;">Full companion app is in the GitHub repo. Enable GitHub Pages on the main branch to get a shareable link.</p>
<p style="padding:12px;"><a href="https://github.com/4geekdna/berkeley-companion">View on GitHub</a></p>
<footer>Berkeley Companion · AH Trip</footer>
</body>
</html>
